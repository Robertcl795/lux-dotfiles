name: Lux G3 tests

on:
  push:
    paths: ["lux/**", "Makefile", ".github/workflows/lux.yml"]
  pull_request:
    paths: ["lux/**", "Makefile", ".github/workflows/lux.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck
      - name: Test synthetic vaults only
        run: make test-lux
